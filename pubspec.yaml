name: storage_cleaner
description: "Storage Cleaner — finds the temporary files your device left behind and gets rid of them, with a way back, and shrinks photos and videos without touching their resolution."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.2+4

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  intl: any

  # Where the app's own cache and the platform's temporary directory actually
  # are. Every other root a rule names is derived from an environment variable
  # or a home directory, which `dart:io` answers on its own.
  path_provider: ^2.1.6

  # Android only, and only for one permission: `MANAGE_EXTERNAL_STORAGE`. It is
  # the difference between a cleaner that can see the device and one that can
  # see its own cache — see `AndroidStorageAccessRepo`.
  permission_handler: ^12.0.3

  # The folder picker behind the fallback route, for a device that refuses all
  # files access. Nothing is ever picked for conversion here; the app only ever
  # asks *where* it is allowed to look.
  file_picker: ^11.0.2

  # Remembers which categories were unticked last time. The quarantine index is
  # deliberately not here — it lives in a manifest beside the quarantined files,
  # so a wiped preference store cannot orphan them. See `IoQuarantineRepo`.
  shared_preferences: ^2.5.5

  # How full the disk actually is — the number the storage ring draws, and the
  # only thing on the home screen before a scan has run. `dart:io` cannot answer
  # it on any platform. Chosen over `disk_space_plus` and `storage_space`, which
  # are Android and iOS only: this fork is the one that also covers Windows and
  # Linux. macOS and web it does not cover, and there
  # `UnsupportedDeviceStorageRepo` answers `null` — see `device_storage/`.
  disk_space_2: ^1.0.13

  # Re-encoding a photograph where there is no native encoder to do it — the
  # two desktops and macOS. Pure Dart, so it needs nothing installed and runs
  # everywhere, and slow enough that every call goes through `Isolate.run`:
  # decoding a 12 MP JPEG takes about a second on a laptop and rather longer on
  # a phone, which is why Android and iOS use the platform's own encoder
  # instead. See `media_optimizer/data/encoders/`.
  image: ^4.5.4

  # And the native one, for the two platforms where a pure-Dart decode of a
  # camera roll would take an afternoon. Wraps `Bitmap.compress` and
  # `UIImage`, both hardware-assisted. `keepExif` is not optional here: the
  # date and the orientation are the file, and a gallery reorders itself
  # without them.
  flutter_image_compress: ^2.4.0

  # Path arithmetic that knows which separator it is on. Named explicitly rather
  # than leaned on transitively, because `ProtectedPaths` is tested against
  # every platform's rules from whichever one CI runs on, and that needs
  # `p.Context(style: …)` — not the ambient one.
  path: ^1.9.1

  # SHA-256, and only for one thing: the video encoder this app downloads is a
  # binary it then executes, so what arrived is compared against the digest its
  # publisher published. `dart:convert` has no hash of any kind, and hand-rolling
  # one to check something that is about to be run would be the wrong place to
  # save a dependency. See `FfmpegSupplyRepo`.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives integration_test/scan_probe_test.dart, which runs the real walker
  # against the real machine. Not used by the app, and not part of CI: the unit
  # tests cover the rules against every platform, and nothing covers whether the
  # paths those rules name actually exist on a device.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb — see l10n.yaml.
  generate: true

  # The icon's artwork without its own background, for the splash to show the
  # real mark rather than a Material glyph standing in for it. Generated by
  # tool/brand_assets.py from the same source as every launcher icon — see
  # docs/BRAND.md, which says why the splash gets the mark and not the icon.
  assets:
    - assets/brand/app_mark.png

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
