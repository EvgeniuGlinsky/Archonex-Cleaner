name: Release

# Tags only. `ci.yml` already covers every push to main and every pull request,
# and this workflow builds four platforms and publishes — running it on anything
# that is not a deliberate release would be minutes of runner time for artefacts
# nobody asked for.
on:
  push:
    tags: ['v*']

# Not cancel-in-progress, unlike CI. A half-published release is worse than a
# slow one: the tag is already pushed, and a cancelled job leaves a release with
# some platforms attached and some missing.
concurrency:
  group: release-${{ github.ref }}

# Only the publish job writes, and it says so there rather than here.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.2

jobs:
  # The tag is what names the artefacts, so it is worth knowing it agrees with
  # pubspec.yaml before spending twenty minutes building things labelled with
  # the wrong number. A mismatch here is almost always a tag pushed before the
  # version bump was committed.
  verify:
    name: Verify the tag matches pubspec
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - id: version
        name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)"

          if [ "$tag" != "$pubspec" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, pubspec.yaml says $pubspec"
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The same two commands CI runs. Repeated rather than trusted from the
      # commit's own CI run, because a tag can point at a commit whose checks
      # were never green — or never ran.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The keystore never exists in the repository — see android/.gitignore.
      # It arrives here as a base64 secret, is written next to the Gradle build
      # that reads it, and goes away with the runner. `docs/RELEASING.md` has
      # the commands that produce both secrets.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the build would fall back to the debug key and produce something no store will take"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      # Four APKs rather than one. --split-per-abi drops roughly half the size
      # for someone who knows their device, and the universal build is there for
      # everyone who does not and for anyone side-loading onto something odd.
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # For Play, which will not take an APK from a new application any more.
      - name: Build the app bundle
        run: flutter build appbundle --release

      - name: Name the artefacts after the release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/storage-cleaner-$VERSION-android-arm32.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/storage-cleaner-$VERSION-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "dist/storage-cleaner-$VERSION-android-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk             "dist/storage-cleaner-$VERSION-android-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab          "dist/storage-cleaner-$VERSION-android.aab"

      # The keystore is gone with the runner either way; removed explicitly so
      # it cannot reach an artefact upload by accident.
      - name: Shred the signing key
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          retention-days: 7

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      # A zip of the release directory rather than an installer. Everything the
      # app needs is beside the exe, it writes nothing outside its own folders
      # until the user points it somewhere, and an unsigned installer is a
      # SmartScreen warning that a folder is not.
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/storage-cleaner-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          retention-days: 7

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # What `flutter build linux` needs and the runner does not have. Pinned to
      # nothing: these are the distribution's own libraries, and the build tracks
      # whatever ubuntu-latest ships.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/storage-cleaner-$VERSION-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          retention-days: 7

  publish:
    name: Publish
    needs: [verify, android, windows, linux]
    runs-on: ubuntu-latest

    # The one job that writes anything, and the only one granted the right to.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -la dist/

      # Published beside the files rather than in the release notes, so a
      # download can be checked with sha256sum -c and not by eye.
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The AAB is for the Play Console and is uploaded by hand. Attached anyway:
      # it is the exact artefact that was submitted, and having it here is what
      # makes a store build reproducible from a tag months later.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          notes=".github/release-notes.md"
          {
            echo "## Storage Cleaner $VERSION"
            echo
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed."
            echo
            echo "### Which file"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Android, most phones since 2016 | \`android-arm64.apk\` |"
            echo "| Android, older 32-bit devices | \`android-arm32.apk\` |"
            echo "| Android, emulators and x86 tablets | \`android-x86_64.apk\` |"
            echo "| Android, if unsure | \`android-universal.apk\` |"
            echo "| Windows 10 and 11, 64-bit | \`windows-x64.zip\` |"
            echo "| Linux, 64-bit | \`linux-x64.tar.gz\` |"
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS.txt\`."
            echo
            echo "The Android builds are signed with the project's release key."
            echo "Windows and Linux are unsigned — code signing certificates cost"
            echo "money this project does not take, so expect a SmartScreen prompt."
          } > "$notes"

          gh release create "$GITHUB_REF_NAME" \
            --title "Storage Cleaner $VERSION" \
            --notes-file "$notes" \
            dist/*
