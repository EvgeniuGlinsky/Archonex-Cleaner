name: macOS smoke

# Temporary. Deleted before this branch reaches main.
#
# The macOS runner has never built this app: there was no macOS job until now,
# and nothing on a Windows machine can stand in for one. Finding that out from
# the release run would mean a tag already pushed, three platforms built and
# `publish` never reached — so it is found out here instead, on a branch, where
# the cost of a failure is a commit.
on:
  push:
    branches: [release-1.1.0]

jobs:
  macos:
    name: Build for macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      # What the release job will do, verbatim, so a packaging mistake surfaces
      # here rather than there.
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            "build/macos/Build/Products/Release/Storage Cleaner.app" \
            dist/storage-cleaner-macos.zip

      # The three questions the release job cannot ask on anyone's behalf: is
      # the bundle universal, is it signed at all, and did the zip keep the
      # symlinks inside Contents/Frameworks rather than copying them.
      - name: Inspect
        run: |
          app="build/macos/Build/Products/Release/Storage Cleaner.app"
          lipo -archs "$app/Contents/MacOS/Storage Cleaner"
          codesign -dv --verbose=2 "$app" 2>&1 || true
          du -sh "$app" dist/storage-cleaner-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-smoke
          path: dist/
          retention-days: 3
