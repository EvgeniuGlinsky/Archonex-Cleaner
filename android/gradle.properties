# The daemon heap is a measured number, not a generous one. R8 on this app --
# minify and shrinkResources over the Flutter embedding, four plugins and the
# transcoder -- completes a `bundleRelease` inside 4 GB with room to spare.
#
# It was -Xmx8G with a 4 GB metaspace, which is 12 GB before the Kotlin compiler
# daemon asks for anything of its own. On a 16 GB machine with an editor and a
# browser open that is not a slow build, it is no build at all: Windows kills the
# daemon mid-R8 and Gradle reports only that it "disappeared unexpectedly" -- no
# exception, no stack, and no heap dump, because the JVM never got to throw. A
# number that turns a normal laptop into an unexplained failure is the wrong
# number even when a CI runner could have afforded it.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
